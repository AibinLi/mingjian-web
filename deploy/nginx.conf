server_tokens off;

server {
    listen 8080;
    server_name _;

    # Nginx rejects bodies before proxying; the API applies the stricter
    # 10 MiB-plus-multipart-overhead limit at the ASGI receive boundary.
    client_max_body_size 11m;
    client_body_buffer_size 16k;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; frame-ancestors 'self'; form-action 'self'; img-src 'self' data:; media-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'" always;

    location / {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        # TrustedHostMiddleware must evaluate the browser's original Host.
        proxy_set_header Host $http_host;
        # The API uses the socket peer allow-list only; do not create a
        # spoofable client-IP trust path through forwarded request headers.
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Real-IP "";
        proxy_set_header X-Forwarded-Proto "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 130s;
        proxy_send_timeout 130s;
    }
}
