services:
  asr:
    profiles: ["asr"]
    image: mingjian-web-api
    command: ["python", "-m", "uvicorn", "backend.app.asr_worker:app", "--host", "0.0.0.0", "--port", "8003", "--no-access-log"]
    environment:
      MINGJIAN_DATA_DIR: /app/backend/data
      MINGJIAN_ASR_MODEL_DIR: /app/models/cache/whisper-base
      MINGJIAN_ASR_TIMEOUT_SECONDS: "60"
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    volumes:
      - mingjian-data:/app/backend/data:ro
      - type: bind
        source: "${MINGJIAN_ASR_MODEL_DIR:-./models/cache/whisper-base}"
        target: /app/models/cache/whisper-base
        read_only: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=256m
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    pids_limit: 64
    mem_limit: 2g
    cpus: 2.0
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8003/health', timeout=8).read()"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    networks:
      mingjian_internal:
        ipv4_address: 172.30.0.4

  deepseek:
    profiles: ["online"]
    image: mingjian-web-api
    env_file: .env
    command: ["python", "-m", "backend.app.deepseek_worker"]
    environment:
      MINGJIAN_LLM_WORKER_PORT: "8006"
      HTTPS_PROXY: http://host.docker.internal:7897
      HTTP_PROXY: http://host.docker.internal:7897
      NO_PROXY: "127.0.0.1,localhost"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    pids_limit: 32
    mem_limit: 256m
    cpus: 0.5
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8006/health', timeout=3).read()"]
      interval: 20s
      timeout: 5s
      start_period: 10s
      retries: 3
    networks:
      mingjian_ingress: {}
      mingjian_internal:
        ipv4_address: 172.30.0.5

  tavily:
    profiles: ["online"]
    image: mingjian-web-api
    env_file: .env
    command: ["python", "-m", "backend.app.tavily_worker_main"]
    environment:
      HTTPS_PROXY: http://host.docker.internal:7897
      HTTP_PROXY: http://host.docker.internal:7897
      NO_PROXY: "127.0.0.1,localhost"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    pids_limit: 32
    mem_limit: 256m
    cpus: 0.5
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8005/health', timeout=3).read()"]
      interval: 20s
      timeout: 5s
      start_period: 10s
      retries: 3
    networks:
      mingjian_ingress: {}
      mingjian_internal:
        ipv4_address: 172.30.0.6

  api:
    image: mingjian-web-api
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      MINGJIAN_ENV: production
      MINGJIAN_CONTAINER_MODE: "1"
      MINGJIAN_RETENTION_SECONDS: "900"
      MINGJIAN_JOB_TIMEOUT_SECONDS: "120"
      ENABLE_ASR: "false"
      ENABLE_OCR: "false"
      ENABLE_FACE: "false"
      ENABLE_SYNC: "false"
      # Disabled by default; explicit .env values enable only the refresh path.
      ENABLE_RETRIEVAL: "${ENABLE_RETRIEVAL:-false}"
      ENABLE_LLM: "${ENABLE_LLM:-false}"
      MINGJIAN_VISUAL_DEVICE: cpu
      MINGJIAN_SCORE_WEIGHT_AUTHENTICITY: "0.40"
      MINGJIAN_SCORE_WEIGHT_CONTENT: "0.25"
      MINGJIAN_SCORE_WEIGHT_PROVENANCE: "0.10"
      MINGJIAN_SCORE_WEIGHT_INTERNET: "0.25"
      MINGJIAN_SCORE_LOW_MAX: "35"
      MINGJIAN_SCORE_HIGH_MIN: "65"
      MINGJIAN_SCORE_MIN_COVERAGE: "0.65"
      MINGJIAN_ASR_WORKER_URL: http://asr:8003
      MINGJIAN_ASR_PIPELINE_TIMEOUT_SECONDS: "70"
      MINGJIAN_TESSERACT_PATH: /usr/bin/tesseract
      MINGJIAN_TESSERACT_LANGUAGES: chi_sim+eng
      TESSDATA_PREFIX: /usr/share/tesseract-ocr/5/tessdata
      MINGJIAN_YUNET_MODEL: /app/models/cache/opencv-yunet/face_detection_yunet_2023mar.onnx
      MINGJIAN_RETRIEVAL_WORKER_URL: "${MINGJIAN_RETRIEVAL_WORKER_URL:-http://tavily:8005}"
      MINGJIAN_LLM_ANALYSIS_URL: "${MINGJIAN_LLM_ANALYSIS_URL:-http://deepseek:8006}"
      # The verified Meso4 checkpoint is present in the local ignored cache.
      # It is mounted read-only below; the image never downloads model files.
      MINGJIAN_MESO4_WEIGHTS: /app/models/cache/deepfakebench/meso4_best.pth
      # This pinned local AST directory is likewise mounted read-only below.
      # The adapter verifies every frozen artifact before it loads anything.
      MINGJIAN_AUDIO_MODEL_DIR: /app/models/cache/ast-asvspoof2019
      # The only non-loopback socket peer trusted by the API is the fixed
      # gateway address on the internal-only media-processing network.
      MINGJIAN_TRUSTED_GATEWAY_IPS: "172.30.0.2"
      # Models are never downloaded. Mount separately verified artifacts read-only
      # and set their explicit paths only when they are authorised for this host.
    volumes:
      - mingjian-data:/app/backend/data
      - type: bind
        source: ./models/cache/deepfakebench
        target: /app/models/cache/deepfakebench
        read_only: true
      - type: bind
        source: ./models/cache/opencv-yunet
        target: /app/models/cache/opencv-yunet
        read_only: true
      - type: bind
        source: "${MINGJIAN_AUDIO_MODEL_DIR:-./models/cache/ast-asvspoof2019}"
        target: /app/models/cache/ast-asvspoof2019
        read_only: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=128m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    mem_limit: 2g
    cpus: 2.0
    restart: unless-stopped
    networks:
      mingjian_internal:
        ipv4_address: 172.30.0.3

  gateway:
    image: nginxinc/nginx-unprivileged:1.27.4-alpine@sha256:62a904036bfc0e4a4f2b556e34cbf17bc136b47fde8cdb4628762725f48c5782
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8080"
    volumes:
      - type: bind
        source: ./deploy/nginx.conf
        target: /etc/nginx/conf.d/default.conf
        read_only: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 64
    mem_limit: 128m
    cpus: 0.5
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/health || exit 1"]
      interval: 20s
      timeout: 5s
      start_period: 10s
      retries: 3
    networks:
      mingjian_ingress: {}
      mingjian_internal:
        ipv4_address: 172.30.0.2

volumes:
  mingjian-data:

networks:
  mingjian_internal:
    internal: true
    ipam:
      config:
        - subnet: 172.30.0.0/24
  mingjian_ingress:
    driver: bridge


